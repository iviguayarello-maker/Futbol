<script>

  if(lg==="NBA"){
    if(!NBAC||Date.now()-NBAT>6e5){const r=await fetch("/.netlify/functions/nba");if(!r.ok){let m="";try{m=(await r.json()).error||""}catch(e){}throw new Error(r.status+(m?": "+m:""))}NBAC=(await r.json()).matches;NBAT=Date.now()}

  const A=D.T[h]||{gf:0,ga:0,n:0},B=D.T[a]||{gf:0,ga:0,n:0},avg=(D.hg+D.ag)/2,k=3;
  const att=t=>(t.gf+k*avg)/(t.n+k)/avg,def=t=>(t.ga+k*avg)/(t.n+k)/avg;
  const lh=D.hg*att(A)*def(B),la=D.ag*att(B)*def(A);
  const mat=(x,y,N)=>{let tot=0;const m=[];for(let i=0;i<=N;i++){m[i]=[];for(let j=0;j<=N;j++){m[i][j]=pois(x,i)*pois(y,j);tot+=m[i][j]}}return{m,tot,N}};
  const F=mat(lh,la,10),H=mat(lh*.45,la*.45,8),P={};
  G.forEach(x=>{const Q=x.ht?H:F;let s=0;for(let i=0;i<=Q.N;i++)for(let j=0;j<=Q.N;j++)if(x.f(i,j))s+=Q.m[i][j];P[x.k]=s/Q.tot});
  P.DNB1=P["1"]/(P["1"]+P["2"]);P.DNB2=P["2"]/(P["1"]+P["2"]);
  return{lh,la,P};
}

function nbaKeys(){
  const C=CATB||[],R={};
  const name=m=>String(m.marketName||"").toLowerCase();
  const oname=o=>String(o.outcomeName||"").toLowerCase().replace(/\s/g,"");
  const score=m=>(/overtime|incl/.test(name(m))?2:0)+(/full ?time|match|game/.test(name(m))?1:0)-(/half|quarter|1st|2nd|3rd|4th/.test(name(m))?5:0);
  const ml=C.filter(m=>/winner|moneyline|money line/.test(name(m))&&(m.outcomes||[]).length===2).sort((a,b)=>score(b)-score(a))[0];
  if(ml){const o1=ml.outcomes.find(o=>["1","home"].includes(oname(o))),o2=ml.outcomes.find(o=>["2","away"].includes(oname(o)));
    if(o1)R.H=[String(ml.marketId),String(o1.outcomeId)];if(o2)R.A=[String(ml.marketId),String(o2.outcomeId)]}
  const tots=C.filter(m=>/over.?under|total/.test(name(m))&&!/team|home|away|player/.test(name(m))&&score(m)>=0);
  const best={};
  tots.forEach(m=>{const L=+m.handicap;if(!(L>100))return;if(!best[L]||score(m)>score(best[L]))best[L]=m});
  Object.entries(best).forEach(([L,m])=>{const ov=(m.outcomes||[]).find(o=>oname(o)==="over"),un=(m.outcomes||[]).find(o=>oname(o)==="under");
    if(ov)R["TO"+L]=[String(m.marketId),String(ov.outcomeId)];if(un)R["TU"+L]=[String(m.marketId),String(un.outcomeId)]});
  return R;
}
function pickPrices(books,R){
  const keys=Object.keys(books),o={},src={};
  Object.entries(R).forEach(([k,[m,x]])=>{
    const have=keys.filter(b=>books[b][m]&&books[b][m][x]);if(!have.length)return;
    let pb=null;for(const re of PREF){pb=have.find(b=>re.test(b));if(pb)break}
    if(pb){o[k]=books[pb][m][x];src[k]=BKNAME(pb)}
    else{o[k]=+med(have.map(b=>books[b][m][x])).toFixed(2);src[k]=have.length>1?`mediana de ${have.length} casas`:BKNAME(have[0])}
  });
  return{o,src};
}

// ---------- Combinadas del mismo partido: probabilidad conjunta ----------
const nbaPred=k=>{let m;
  if(k==="H")return(h,a)=>h>a;
  if(k==="A")return(h,a)=>a>h;
  if(m=k.match(/^HM([\d.]+)$/)){const L=+m[1];return(h,a)=>h-a>L}
  if(m=k.match(/^AP([\d.]+)$/)){const L=+m[1];return(h,a)=>h-a<L}
  if(m=k.match(/^AM([\d.]+)$/)){const L=+m[1];return(h,a)=>a-h>L}
  if(m=k.match(/^HP([\d.]+)$/)){const L=+m[1];return(h,a)=>a-h<L}
  if(m=k.match(/^TO([\d.]+)$/)){const L=+m[1];return(h,a)=>h+a>L}
  if(m=k.match(/^TU([\d.]+)$/)){const L=+m[1];return(h,a)=>h+a<L}
  if(m=k.match(/^HO([\d.]+)$/)){const L=+m[1];return(h,a)=>h>L}
  if(m=k.match(/^AO([\d.]+)$/)){const L=+m[1];return(h,a)=>a>L}
  if(k==="H10")return(h,a)=>h-a>9.5;
  if(k==="A10")return(h,a)=>a-h>9.5;
  if(k==="CL5")return(h,a)=>Math.abs(h-a)<5.5;
  return null;
};
const JC={};
function jointGroup(L){
  if(!L.length)return 1;
  if(L.length===1)return L[0].p;
  const x0=L[0];
  if(!(x0.lh>0&&x0.la>0))return L.reduce((a,x)=>a*x.p,1);
  const key=x0.sp+"|"+x0.lh.toFixed(3)+"|"+x0.la.toFixed(3)+"|"+L.map(x=>x.mk).sort().join(",");
  if(JC[key]!==undefined)return JC[key];
  let res;
  if(x0.sp==="nba"){
    // Margen y total son normales independientes (desvíos 12,5 y 17, como el modelo); cada equipo = (total ± margen) / 2.
    const sM=12.5,sT=17,mu=x0.lh-x0.la,tt=x0.lh+x0.la,preds=[],ind=[];
    L.forEach(x=>{const f=nbaPred(x.mk);if(f)preds.push(f);else ind.push(x.p)});
    const cells=(m,sd,st)=>{const out=[];for(let v=m-4.5*sd;v<m+4.5*sd;v+=st)out.push([v+st/2,Phi((v+st-m)/sd)-Phi((v-m)/sd)]);return out};
    const DM=cells(mu,sM,.25),TM=cells(tt,sT,.25);let ok=0,tot=0;
    for(const [d,wd] of DM)for(const [t,wt] of TM){const w=wd*wt;tot+=w;const h=(t+d)/2,a=(t-d)/2;if(preds.every(f=>f(h,a)))ok+=w}
    res=(tot?ok/tot:0)*ind.reduce((a,b)=>a*b,1);
  }else{
    // Fútbol: matriz de Poisson de resultados exactos (90') y otra para el primer tiempo.
    const mat=(x,y)=>{const m=[];let t=0;for(let i=0;i<=10;i++){m[i]=[];for(let j=0;j<=10;j++){m[i][j]=pois(x,i)*pois(y,j);t+=m[i][j]}}return{m,t}};
    const part=(L2,F)=>{if(!L2.length)return 1;const fs=L2.map(x=>G.find(y=>y.k===x.mk).f);let s=0;for(let i=0;i<=10;i++)for(let j=0;j<=10;j++)if(fs.every(f=>f(i,j)))s+=F.m[i][j];return s/F.t};
    const ft=[],ht=[],ind=[];
    L.forEach(x=>{const g=G.find(y=>y.k===x.mk);if(!g||/^DNB/.test(x.mk))ind.push(x.p);else(g.ht?ht:ft).push(x)});
    res=part(ft,mat(x0.lh,x0.la))*part(ht,mat(x0.lh*.45,x0.la*.45))*ind.reduce((a,b)=>a*b,1);
  }
  return JC[key]=res;
}
function groups(){const g=new Map();S.slip.forEach(x=>{if(!g.has(x.id))g.set(x.id,[]);g.get(x.id).push(x)});return[...g.values()]}
function calc(){
  const GR=groups();let p=1,od=1,ok=S.slip.length>0,est=false;
  GR.forEach(L=>{
    p*=jointGroup(L);
    if(L.length>1){const q=+((S.gq||{})[L[0].id]);if(q>1)od*=q;else if(L.every(x=>+x.odds>1)){od*=L.reduce((a,x)=>a*x.odds,1);est=true}else ok=false}
    else{if(+L[0].odds>1)od*=+L[0].odds;else ok=false}
  });
  const ev=ok?p*od-1:null,mx=S.cap*S.pct/100,k=ok&&ev>0?ev/(od-1)/4:0,sug=S.cap?Math.min(S.cap*k,mx):0;
  return{p,od,ok,ev,mx,sug,est};
}

     const opts=MLIST(h,a).filter(x=>!skip.test(x.k)||isNBA()).map(x=>({m,i,k:x.k,l:x.l(sn(m.homeTeam),sn(m.awayTeam)),p:M.P[x.k],o:o[x.k]})).filter(z=>z.p>=band[0]&&z.p<=band[1]);
     opts.forEach(z=>z.e=z.o?edge(z.p,z.o):null);
     const pool=obj==="v"?opts.filter(z=>z.e>0).sort((a,b)=>b.e-a.e):opts.sort((a,b)=>b.p-a.p);return pool[0]}).filter(Boolean);
   cand.sort((a,b)=>obj==="v"?b.e-a.e:b.p-a.p);
   const pick=cand.slice(0,n);GENPICK=pick;
   if(!pick.length)return res([["Sin propuestas",obj==="v"?"Traé cuotas en algunos partidos primero":"Probá otro nivel de riesgo"]]);
   const p=pick.reduce((a,z)=>a*z.p,1),fo=1/p,allo=pick.every(z=>z.o),od=allo?pick.reduce((a,z)=>a*z.o,1):null;
   return`<div class="card legs">${pick.map(z=>`<div class="leg"><div class="lh"><div><b>${esc(z.l)}</b><span>${esc(sn(z.m.homeTeam))} vs ${esc(sn(z.m.awayTeam))}</span></div><em class="tag">${pc(z.p)}</em></div>${z.o?`<div class="mu small">Cuota ${fx2(z.o)} · ${z.e>0?"+":""}${Math.round(z.e*100)}% de valor</div>`:""}</div>`).join("")}</div>`+
    res([["Prob. de acertar todas",pctf(p)],["Cuota justa total",fx2(fo)],...(od?[["Cuota total de las casas",fx2(od)],["Valor esperado",(od*p-1>0?"+":"")+pctf(od*p-1,0),od*p>1?"ok":"bad"]]:[])],pick.length<n?`Solo encontré ${pick.length} con ese riesgo.`:"")+
    `<button class="btn" data-a="genadd">Cargar al cupón</button>`;
  }},
 sys:{
  ui:()=>{const L=S.slip.filter(x=>+x.odds>1);return L.length<3?`<p class="mu">Necesitás al menos 3 selecciones con cuota en el cupón. Ahora tenés ${L.length}.</p>`:
   `<p class="mu small">${L.length} selecciones con cuota del cupón.</p><div class="grid2"><div><label class="lbl">Tipo</label><select id="s_k" class="field">${Array.from({length:L.length-1},(_,j)=>j+2).filter(k=>k<L.length).map(k=>`<option value="${k}"${k===L.length-1?" selected":""}>${k} de ${L.length}</option>`).join("")}</select></div>${inp("s_t","Monto total ($)",S.stake||1000)}</div>`},
  calc:()=>{const L=S.slip.filter(x=>+x.odds>1);if(L.length<3)return"";
   const k=+(document.getElementById("s_k")||{value:L.length-1}).value,T=num("s_t");if(!(T>0))return"";
   const C=combos(L,k),st=T/C.length,ret=c=>st*c.reduce((a,x)=>a*x.odds,1);
   const ev=C.reduce((a,c)=>a+ret(c)*c.reduce((q,x)=>q*x.p,1),0)-T;
   const sorted=L.slice().sort((a,b)=>a.odds-b.odds),minK=ret(sorted.slice(0,k));
   const all=C.reduce((a,c)=>a+ret(c),0);
   let pk=0;combos(L.map((_,i)=>i),k).forEach(()=>{});
   // prob de acertar al menos k (independencia)
   const dp=Array(L.length+1).fill(0);dp[0]=1;L.forEach(x=>{for(let j=L.length;j>=0;j--)dp[j]=dp[j]*(1-x.p)+(j?dp[j-1]*x.p:0)});
   for(let j=k;j<=L.length;j++)pk+=dp[j];
   return res([["Combinadas",C.length],["Monto por combinada",mon(st)],["Cobrás si aciertan solo "+k+" (peor caso)",mon(minK),minK>=T?"ok":"bad"],["Cobrás si aciertan todas",mon(all),"ok"],["Prob. de cobrar algo",pctf(pk)],["Valor esperado",(ev>=0?"+":"")+mon(ev),ev>=0?"ok":"bad"]],"Con un sistema cobrás aunque falle alguna selección, a cambio de pagar más combinadas.");}},
 devig:{
  ui:()=>`<div class="grid3">${inp("d1","Cuota 1","","2.10")}${inp("d2","Cuota X / 2","","3.40")}${inp("d3","Cuota 3 (opcional)","","3.60")}</div><p class="mu small">Para mercados de 2 opciones dejá vacío el tercero.</p>`,
  calc:()=>{const o=[num("d1"),num("d2"),num("d3")].filter(x=>x>1);if(o.length<2)return"";
   const s=o.reduce((a,x)=>a+1/x,0),f=o.map(x=>(1/x)/s);
   return res([["Margen de la casa",pctf(s-1),s-1>.06?"bad":""],...f.map((p,i)=>[`Opción ${i+1}: prob. real`,`${pctf(p)} · justa ${fx2(1/p)}`])],"Si el modelo de Valora da más probabilidad que la real del mercado, hay valor.");}},
 kelly:{
  ui:()=>`<div class="grid2">${inp("k_p","Tu probabilidad (%)","","55","0.1")}${inp("k_o","Cuota","","2.00")}${inp("k_b","Banca ($)",S.cap||"","")}${inp("k_f","Fracción Kelly (%)",25,"25","1")}</div>`,
  calc:()=>{const p=num("k_p")/100,o=num("k_o"),b=num("k_b"),f=(num("k_f")||25)/100;if(!(p>0&&p<1&&o>1))return"";
   const e=p*o-1,k=e/(o-1),stake=b>0?Math.max(0,b*k*f):null,cap=b>0?b*S.pct/100:null;
   return res([["Valor esperado",(e>0?"+":"")+pctf(e),e>0?"ok":"bad"],["Cuota mínima para tener valor",fx2(1/p)],["Kelly completo",k>0?pctf(k)+" de la banca":"No apostar",k>0?"":"bad"],...(stake!==null?[["Monto sugerido",k>0?mon(stake):"$0"],["Tope por tu % ("+S.pct+"%)",mon(cap)]]:[])],"Kelly fraccional (25%) baja mucho la variabilidad a cambio de crecer un poco más lento.");}},
 conv:{
  ui:()=>`<div class="grid2">${inp("c_d","Decimal","","2.50")}${inp("c_a","Americana","","+150","1")}</div>`,
  calc:()=>{let d=num("c_d");const a=num("c_a");if(!(d>1)&&a)d=a>0?1+a/100:1+100/Math.abs(a);if(!(d>1))return"";
   const am=d>=2?"+"+Math.round((d-1)*100):"-"+Math.round(100/(d-1));
   const fr=(()=>{const x=d-1;let bestn=1,bestd=1,be=9;for(let q=1;q<=20;q++){const n=Math.round(x*q),e=Math.abs(x-n/q);if(e<be-1e-9){be=e;bestn=n;bestd=q}}return bestn+"/"+bestd})();
   return res([["Decimal",fx2(d)],["Americana",am],["Fraccional",fr],["Probabilidad implícita",pctf(1/d)]]);}},
 arb:{
  ui:()=>`<div class="grid3">${inp("a1","Cuota A","","2.10")}${inp("a2","Cuota B","","2.05")}${inp("a3","Cuota C (opcional)","","")}</div>${inp("at","Monto total ($)",1000)}<p class="mu small">Usá la mejor cuota de cada resultado, aunque sean de casas distintas.</p>`,
  calc:()=>{const o=[num("a1"),num("a2"),num("a3")].filter(x=>x>1),T=num("at");if(o.length<2||!(T>0))return"";
   const s=o.reduce((a,x)=>a+1/x,0),st=o.map(x=>T*(1/x)/s),pay=T/s;
   return res([[s<1?"¡Hay surebet!":"No hay surebet",s<1?"+"+pctf(1/s-1,2):pctf(1/s-1,2),s<1?"ok":"bad"],...st.map((v,i)=>["Apostar a "+"ABC"[i],mon(v)]),["Cobrás pase lo que pase",mon(pay),s<1?"ok":""]],s<1?"Revisá que las cuotas sigan vigentes antes de apostar: cambian rápido.":"La suma de probabilidades implícitas supera 100%.");}},
 hedge:{
  ui:()=>`<div class="grid2">${inp("h_s","Monto de tu combinada ($)",S.stake||"")}${inp("h_o","Cuota total de la combinada","")}${inp("h_c","Cuota en contra del último partido","","3.20")}</div><p class="mu small">"En contra" = apostar a que tu última selección NO sale (por ejemplo, empate o gana el rival).</p>`,
  calc:()=>{const s=num("h_s"),o=num("h_o"),c=num("h_c");if(!(s>0&&o>1&&c>1))return"";
   const pay=s*o,H=pay/c,win=pay-s-H,lose=H*c-s-H;
   return res([["Apostá en contra",mon(H)],["Si sale tu combinada",(win>=0?"+":"")+mon(win),win>=0?"ok":"bad"],["Si sale la cobertura",(lose>=0?"+":"")+mon(lose),lose>=0?"ok":"bad"],["Sin cubrir: cobrás o perdés",`+${mon(pay-s)} / -${mon(s)}`]],"Cubrir asegura un resultado parejo a cambio de resignar parte de la ganancia máxima.");}},
 sim:{
  ui:()=>`<div class="grid2">${inp("m_p","Prob. de acierto (%)",55,"","0.1")}${inp("m_o","Cuota promedio",2,"")}${inp("m_s","% de banca por apuesta",S.pct||2,"","0.1")}${inp("m_n","Cantidad de apuestas",300,"","1")}</div><button class="btn ghost" data-a="simrun">Simular 2.000 veces</button>`,
  calc:()=>SIMOUT||`<p class="mu small center">Completá los datos y tocá Simular.</p>`}
};
let GENPICK=[],SIMOUT="";
function runSim(){
  const p=num("m_p")/100,o=num("m_o"),f=num("m_s")/100,N=Math.min(5000,Math.round(num("m_n")));
  if(!(p>0&&p<1&&o>1&&f>0&&f<1&&N>0)){SIMOUT=res([["Revisá los datos",""]]);return}
  const R=[];let ruin=0,prof=0;
  for(let r=0;r<2000;r++){let b=1,mn=1;for(let i=0;i<N;i++){const s=b*f;b+=Math.random()<p?s*(o-1):-s;if(b<mn)mn=b}R.push(b);if(mn<=.5)ruin++;if(b>1)prof++}
  R.sort((a,b)=>a-b);const q=x=>R[Math.floor(x*(R.length-1))],e=p*o-1;
  const pc2=v=>(v>=1?"+":"")+((v-1)*100).toFixed(0)+"%";
  SIMOUT=res([["Valor esperado por apuesta",(e>0?"+":"")+pctf(e),e>0?"ok":"bad"],["Resultado típico (mediana)",pc2(q(.5)),q(.5)>=1?"ok":"bad"],["Escenario malo (10% peores)",pc2(q(.1)),q(.1)>=1?"ok":"bad"],["Escenario bueno (10% mejores)",pc2(q(.9)),"ok"],["Chance de terminar ganando",pctf(prof/2000,0)],["Chance de perder la mitad en algún momento",pctf(ruin/2000,0),ruin/2000>.2?"bad":""]],"Simulación con montos proporcionales a la banca. Muestra la variabilidad aun con ventaja real.");
}

// ---------- render ----------
function headerRefresh(){
  document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.sp===(isNBAlg()?"nba":"fut")));
  const lw=$("#lgs");lw.style.display=tab==="m"&&!isNBAlg()?"flex":"none";
  lw.querySelectorAll(".pill").forEach(b=>b.classList.toggle("on",b.dataset.l===lg));
}
const isNBAlg=()=>lg==="NBA";
let DRAWN=0;
function softSlip(){const tmp=document.createElement("div");tmp.innerHTML=vSlip();["sumtop","sret"].forEach(c=>{const a=document.querySelector("."+c),b=tmp.querySelector("."+c);if(a&&b)a.innerHTML=b.innerHTML})}
function draw(){DRAWN++;
  const ae=document.activeElement,fid=ae&&ae.id,pos=ae&&ae.selectionStart;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  headerRefresh();
  $("#sl").textContent=S.slip.length?S.slip.length:"";
  const f=$("#fab");
  if(S.slip.length&&tab==="m"&&SHEET===null){const c=calc();f.innerHTML=`<span class="fl"><b>${S.slip.length}</b> en el cupón</span><span>${c.ok?"Cuota "+fx2(c.od)+" · ":""}${pctf(c.p,0)} ›</span>`;f.classList.add("show")}else f.classList.remove("show");
  const app=$("#app"),v=tab==="m"?vMatches():tab==="c"?vSlip():tab==="t"?vTools():tab==="ai"?vAI():vMoney();
  if(app.dataset.tab!==tab){app.classList.remove("fade");void app.offsetWidth;app.classList.add("fade");app.dataset.tab=tab}
  app.innerHTML=v;
  $("#foot").style.display=tab==="ai"||tab==="t"?"none":"block";
  $("#sheetwrap").innerHTML=tab==="m"?vSheet():"";
  document.body.classList.toggle("lock",SHEET!==null&&tab==="m");
  const aw=$("#askwrap");
  if(tab==="ai"){if(!$("#aiq"))aw.innerHTML=`<div class="ask"><div class="askin"><textarea id="aiq" rows="1" placeholder="Preguntale a Valora IA..."></textarea><button class="go" data-a="send" aria-label="Enviar">➤</button></div></div>`;$("#aiq").disabled=AIBUSY}else aw.innerHTML="";
  if(fid&&fid!=="aiq"){const e=document.getElementById(fid);if(e&&e.tagName==="INPUT"){e.focus();try{if(pos!=null)e.setSelectionRange(pos,pos)}catch(x){}}}
}

// ---------- eventos ----------
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-a],[data-t],[data-l],[data-d],[data-sp]");if(!t)return;
  if(t.matches("input,select,textarea"))return;
  if(t.dataset.sp){const sp=t.dataset.sp;lg=sp==="nba"?"NBA":S.flg;S.sport=sp;save();DAY="all";SHEET=null;SEARCH="";load();return}
  if(t.dataset.d){DAY=t.dataset.d;draw();return}
  if(t.dataset.t){tab=t.dataset.t;SHEET=null;if(tab==="t"&&t.closest("nav"))TOOL=null;draw();scrollTo({top:tab==="ai"?document.body.scrollHeight:0});return}
  if(t.dataset.l){lg=t.dataset.l;S.flg=lg;save();DAY="all";SHEET=null;t.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});load();return}
  const a=t.dataset.a,i=+t.dataset.i;
  if(a==="open"){if(e.target.closest(".q"))return;SHEET=i;draw();return}
  if(a==="close"){SHEET=null;draw();return}
  if(a==="pick"){e.stopPropagation();const m=D.n[i];MK[m.id]=t.dataset.k;addLeg(m,t.dataset.k);draw();return}
  if(a==="setmk"){MK[t.dataset.m]=t.dataset.k;draw();return}
  if(a==="odds"){fetchOdds(i);return}
  if(a==="slipodds"){fetchSlipOdds();return}
  if(a==="seen"){S.seen=1;save();draw();return}
  if(a==="reload"){load();return}
  if(a==="sug"){ask(t.dataset.q);return}
  if(a==="send"){const q=$("#aiq");const v=q.value;q.value="";ask(v);return}
  if(a==="clearchat"){CHAT=[];saveChat();draw();return}
  if(a==="aislip"){ask("Analizá mi cupón como apostador profesional: veredicto por selección (apostar/pasar/esperar mejor cuota), cuál resta valor, y monto sugerido según mi banca.");return}
  if(a==="aimatch"){const m=D.n[i];ask(`Analizá ${m.homeTeam.name} vs ${m.awayTeam.name} buscando valor: mercados con mejor relación probabilidad/cuota, desde qué cuota entrar y riesgos.`);return}
  if(a==="stk"){S.stake=t.dataset.v;save();draw();return}
  if(a==="share"){const txt=slipText();if(navigator.share)navigator.share({text:txt}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast("Copiado al portapapeles"));return}
  if(a==="clearslip"){if(confirm("¿Vaciar el cupón?")){S.slip=[];S.gq={};SLmsg="";save();draw()}return}
  if(a==="rm"){const id=S.slip[i].id;S.slip.splice(i,1);if(S.gq&&S.slip.filter(x=>x.id===id).length<2)delete S.gq[id];save();draw();return}
  if(a==="tool"){TOOL=t.dataset.tool||null;tab="t";SIMOUT="";draw();scrollTo({top:0});return}
  if(a==="genadd"){let n=0;GENPICK.forEach(z=>{if(!S.slip.some(x=>x.id===z.m.id)){addLeg(z.m,z.k,1);n++}});toast(n?`Cargadas ${n} selecciones`:"Ya estaban en el cupón");tab="c";draw();scrollTo({top:0});return}
  if(a==="simrun"){SIMOUT='<p class="mu small center">Simulando...</p>';$("#tout").innerHTML=SIMOUT;setTimeout(()=>{runSim();$("#tout").innerHTML=SIMOUT},30);return}
  if(a==="reg"){
    const c=calc(),s=+S.stake;
    if(!c.ok||!(s>0)){toast("Cargá todas las cuotas y el monto");return}
    if(S.cap&&s>c.mx*1.001&&!confirm("Superás tu monto por apuesta ("+S.pct+"% de la banca). ¿Registrar igual?"))return;
    S.bets.push({d:S.slip.map(x=>x.l).join(" + "),s,o:c.od,p:c.p,r:"?",t:Date.now(),n:S.slip.length});
    S.slip=[];S.stake="";SLmsg="";save();tab="d";draw();scrollTo({top:0});toast("Apuesta registrada");return}
  if(a==="res"){S.bets[i].r=t.dataset.r;save();draw();return}
  if(a==="del"){S.bets.splice(i,1);save();draw();return}
  if(a==="cfg"){S.cap=+$("#cp").value||0;S.pct=Math.min(+$("#pp").value||1.5,100);S.ld=+$("#ld").value||0;S.lw=+$("#lw").value||0;save();draw();toast("Banca guardada");return}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="srch"){SEARCH=t.value;const app=$("#app");const y=scrollY;app.innerHTML=vMatches();const s=$("#srch");s.focus();s.setSelectionRange(SEARCH.length,SEARCH.length);scrollTo({top:y});return}
  if(t.closest("#tool")&&TOOL&&TOOL!=="sim"){$("#tout").innerHTML=TF[TOOL].calc();return}
  if(t.id==="stk"){S.stake=t.value;save();const c=calc(),r=document.querySelector(".sret b");if(r)r.textContent=c.ok&&+t.value?mon(+t.value*c.od):"—";return}
  if(t.dataset.o!==undefined){const x=S.slip[+t.dataset.o];x.odds=t.value;x.src=t.value?"tu carga":"";save();return}
  if(t.dataset.g!==undefined){S.gq=S.gq||{};if(t.value)S.gq[t.dataset.g]=t.value;else delete S.gq[t.dataset.g];save();return}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.o!==undefined||t.dataset.g!==undefined){const d0=DRAWN;setTimeout(()=>{if(DRAWN!==d0)return;const ae=document.activeElement;if(ae&&ae.matches&&ae.matches(".oin input,#stk"))softSlip();else draw()},180);return}
  if(t.closest&&t.closest("#tool")&&TOOL){if(TOOL==="sim")return;$("#tout").innerHTML=TF[TOOL].calc();return}
  if(t.dataset.m!==undefined){MK[t.dataset.m]=t.value;draw();return}
});
document.addEventListener("keydown",e=>{if(e.target.id==="aiq"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();const v=e.target.value;e.target.value="";ask(v)}if(e.key==="Escape"&&SHEET!==null){SHEET=null;draw()}});
load();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));

</script></body></html>
