<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fútbol con criterio</title>
<style>
:root{--bg:#07090f;--c:#10141d;--c2:#171d2a;--c3:#1f2737;--fg:#f2f5fb;--mu:#8c96ab;--ac:#2de08a;--ac2:#12b76a;--bad:#ff5d6c;--wn:#ffc857;--bl:#5b8cff;--bd:#222a3a;--glow:rgba(45,224,138,.18);color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#eef1f7;--c:#fff;--c2:#f3f5fa;--c3:#e6eaf3;--fg:#121726;--mu:#66708a;--ac:#0b9b5b;--ac2:#087a49;--bad:#d63a4a;--wn:#a87400;--bl:#2f5fe0;--bd:#dde2ee;--glow:rgba(11,155,91,.14);color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(900px 420px at 50% -120px,var(--glow),transparent 70%),var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:180px}
header{position:sticky;top:0;z-index:20;padding:12px 14px 10px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{font-size:19px;margin:0;letter-spacing:-.3px}h1 span{background:linear-gradient(90deg,var(--ac),var(--bl));-webkit-background-clip:text;background-clip:text;color:transparent}
.live{font-size:11px;color:var(--mu);display:flex;align-items:center;gap:6px}.live i{width:7px;height:7px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 0 var(--ac);animation:pl 2s infinite}
@keyframes pl{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.lsel{width:100%;padding:11px 12px;border-radius:14px;border:1px solid var(--bd);background:var(--c);color:var(--fg);font:inherit;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
main,.ft{max-width:700px;margin:0 auto;padding:10px 14px}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}
.day{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--c);color:var(--mu);font:inherit;font-size:13px;transition:.2s}
.day.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#03150b;border-color:transparent;font-weight:700;transform:scale(1.04)}
.card{background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 90%,var(--c3)));border:1px solid var(--bd);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mu{color:var(--mu);font-size:12.5px}.ok{color:var(--ac)}.bad{color:var(--bad)}.wn{color:var(--wn)}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:6px 0 4px}
.tm{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:650;font-size:13.5px;line-height:1.15}
.cr{width:46px;height:46px;border-radius:50%;background:var(--c3);display:grid;place-items:center;overflow:hidden;font-weight:800;color:var(--mu);border:1px solid var(--bd)}.cr img{width:34px;height:34px;object-fit:contain}
.vs{text-align:center;color:var(--mu);font-size:12px}.vs b{display:block;font-size:15px;color:var(--fg)}
.dots span{display:inline-block;width:17px;height:17px;line-height:17px;text-align:center;border-radius:6px;font-size:9.5px;font-weight:800;color:#fff;margin:0 1.5px}
.G{background:#17a35f}.E{background:#7a8296}.P{background:#d6453f}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;margin:12px 0 6px;background:var(--c3);gap:2px}
.bar i{display:block;height:100%;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.pr{display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.pr span:nth-child(1){color:var(--ac)}.pr span:nth-child(2){color:var(--mu)}.pr span:nth-child(3){color:var(--wn)}
.mks{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none;scroll-snap-type:x proximity}.mks::-webkit-scrollbar{display:none}
.mk{flex:none;scroll-snap-align:start;min-width:92px;padding:9px 10px;border-radius:14px;border:1px solid var(--bd);background:var(--c2);color:var(--fg);font:inherit;font-size:11.5px;text-align:center;line-height:1.2;position:relative;overflow:hidden;transition:.18s}
.mk b{display:block;font-size:16px;margin-top:2px}.mk::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:var(--p);background:linear-gradient(90deg,var(--ac),var(--bl))}
.mk:active{transform:scale(.94)}.mk.cur{border-color:var(--ac);background:var(--glow)}.mk.in{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#03150b;border-color:transparent}.mk.in::after{display:none}
.mk small{display:block;font-size:10.5px;opacity:.85}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--c2);color:var(--fg);font:inherit}
input:focus,.lsel:focus{outline:2px solid var(--ac);outline-offset:1px}
label{display:block;margin:12px 0 5px}
.btn{width:100%;padding:13px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#03150b;font:inherit;font-weight:800;margin-top:10px;box-shadow:0 6px 18px var(--glow);transition:.15s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4;box-shadow:none}
.btn.ghost{background:var(--c2);color:var(--fg);box-shadow:none;border:1px solid var(--bd);font-weight:600}
.mkbox{margin-top:12px;padding:12px;border-radius:16px;background:var(--c2);border:1px solid var(--bd)}.mksel{background-color:var(--c3);font-size:14px}
.sm{padding:7px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--c2);color:var(--fg);font:inherit;font-size:12px;transition:.15s}.sm:active{transform:scale(.94)}
.odd{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--c2);border:1px dashed var(--bd)}
.val{padding:4px 10px;border-radius:99px;font-weight:800;font-size:12px}.val.up{background:rgba(45,224,138,.18);color:var(--ac)}.val.dn{background:rgba(255,93,108,.15);color:var(--bad)}
.k{display:grid;grid-template-columns:1fr 1fr;gap:10px}.k div{background:var(--c2);border-radius:16px;padding:12px}.k b{display:block;font-size:20px;margin-top:2px}
.ring{width:120px;height:120px;margin:4px auto 10px;position:relative}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--c) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--bd)}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11.5px;padding:6px 2px;border-radius:14px;transition:.2s}
nav button.on{color:var(--ac);font-weight:700;background:var(--glow)}nav b{font-size:21px;display:block}
.fab{position:fixed;left:14px;right:14px;bottom:76px;z-index:25;display:none;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:18px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#03150b;font-weight:800;border:0;font:inherit;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:up .3s}
.fab.show{display:flex}.fab span{font-weight:600;font-size:12.5px}
.toast{position:fixed;left:50%;top:76px;transform:translate(-50%,-20px);opacity:0;z-index:50;padding:10px 16px;border-radius:99px;background:var(--fg);color:var(--bg);font-size:13px;font-weight:600;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sk{height:210px;border-radius:22px;margin:12px 0;background:linear-gradient(90deg,var(--c) 25%,var(--c2) 50%,var(--c) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:36px 16px;color:var(--mu)}.empty b{display:block;font-size:34px;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><div class="top"><h1>⚽ Fútbol <span>con criterio</span></h1><div class="live"><i></i>Datos de la temporada</div></div><select id="lgsel" class="lsel"><option value="PL">Premier League (Inglaterra)</option><option value="PD">LaLiga (España)</option><option value="SA">Serie A (Italia)</option><option value="BL1">Bundesliga (Alemania)</option><option value="FL1">Ligue 1 (Francia)</option><option value="BSA">Brasileirão (Brasil)</option><option value="CL">Champions League</option><option value="ELC">Championship (Inglaterra 2)</option><option value="DED">Eredivisie (Países Bajos)</option><option value="PPL">Primeira Liga (Portugal)</option></select></header>
<main id="app"></main>
<p class="mu ft">Las probabilidades son estimaciones de un modelo simple y describen el pasado: no son certezas. Ninguna apuesta es segura. Apostá solo lo que puedas perder y respetá tus límites.</p>
<button class="fab" id="fab" data-t="c"></button><div class="toast" id="toast"></div>
<nav><button data-t="m" class="on"><b>⚽</b>Partidos</button><button data-t="c"><b>🧾</b>Combinada <span id="sl"></span></button><button data-t="d"><b>💰</b>Mi dinero</button></nav>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={cap:0,pct:1.5,ld:0,lw:0,stake:"",bets:[],slip:[]},tab="m",lg="PL",D=null,err="";
try{Object.assign(S,JSON.parse(localStorage.getItem("fc2")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("fc2",JSON.stringify(S))}catch(e){}};
const get=async q=>{const r=await fetch("/.netlify/functions/fd?p="+encodeURIComponent(q));if(!r.ok)throw new Error(r.status);return(await r.json()).matches};
const pc=x=>Math.round(x*100)+"%";
const mon=n=>"$"+Math.round(n).toLocaleString("es-AR");
const FACT=[1];for(let i=1;i<=12;i++)FACT[i]=FACT[i-1]*i;
const pois=(l,k)=>Math.exp(-l)*Math.pow(l,k)/FACT[k];
let DAY="all";
const toast=m=>{const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),1800)};
const dkey=d=>new Date(d).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"});
const dlab=d=>{const t=new Date(d),h=new Date();h.setHours(0,0,0,0);const n=Math.round((new Date(t).setHours(0,0,0,0)-h)/864e5);return n===0?"Hoy":n===1?"Mañana":t.toLocaleDateString("es-AR",{weekday:"short",day:"numeric"})};
const OD={},BK="betano";let ODmsg={};
const norm=t=>String(t||"").toLowerCase().replace("wolverhampton wanderers","wolves").replace("internazionale","inter").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\b(fc|cf|afc|sc|ac|as|cd|ud|sv|fk|the|club|de)\b/g," ").replace(/[^a-z0-9 ]/g," ").split(" ").filter(x=>x.length>1);
const sim=(a,b)=>{const A=norm(a),B=norm(b);if(!A.length||!B.length)return 0;const i=A.filter(x=>B.some(y=>y===x||(x.length>=3&&y.length>=3&&(x.startsWith(y)||y.startsWith(x))))).length;return i/Math.min(A.length,B.length)};
const fnm=(f,k)=>{const c=k===1?[f.participant1Name,f.homeTeamName,f.homeTeam&&f.homeTeam.name,f.home&&f.home.name,f.team1Name]:[f.participant2Name,f.awayTeamName,f.awayTeam&&f.awayTeam.name,f.away&&f.away.name,f.team2Name];return c.find(x=>typeof x==="string")||""};
const fts=f=>new Date(f.startTime||f.trueStartTime||f.startAt||f.date||0).getTime();
const opget=async q=>{const r=await fetch("/.netlify/functions/op?p="+encodeURIComponent(q));if(!r.ok)throw new Error("OddsPapi "+r.status);return r.json()};
const price=(b,m,o)=>{try{const x=b.markets[m].outcomes[o].players["0"];return x&&x.active!==false&&x.price>1?x.price:null}catch(e){return null}};
const LS={get:(k)=>{try{const x=JSON.parse(localStorage.getItem(k)||"null");return x&&x.e>Date.now()?x.v:null}catch(e){return null}},set:(k,v,ms)=>{try{localStorage.setItem(k,JSON.stringify({v,e:Date.now()+ms}))}catch(e){}}};
let CAT=null;
async function catalog(){
  if(CAT)return CAT;CAT=LS.get("op_cat");
  if(!CAT){const r=await opget("markets?language=en");CAT=Array.isArray(r)?r.filter(m=>!m.sportId||m.sportId===10):[];LS.set("op_cat",CAT,30*864e5)}
  return CAT;
}
// Para cada mercado de la app: [nombre del mercado en OddsPapi, línea, nombre del resultado]
const OPMAP={"1":["full time result",0,"1"],X:["full time result",0,"x"],"2":["full time result",0,"2"],
 "1X":["double chance",null,"1x"],X2:["double chance",null,"x2"],"12":["double chance",null,"12"],
 DNB1:["draw no bet",null,"1"],DNB2:["draw no bet",null,"2"],
 B:["both teams to score",null,"yes"],N:["both teams to score",null,"no"]};
[0.5,1.5,2.5,3.5,4.5,5.5].forEach(L=>{const t=String(L).replace(".","");OPMAP["O"+t]=["over under full time",L,"over"];OPMAP["U"+t]=["over under full time",L,"under"]});
function resolve(k){
  const r=OPMAP[k];if(!r||!CAT)return null;
  const m=CAT.find(x=>String(x.marketName||"").toLowerCase()===r[0]&&(r[1]===null||Math.abs((+x.handicap||0)-r[1])<1e-6));
  if(!m)return null;
  const o=(m.outcomes||[]).find(y=>String(y.outcomeName||"").toLowerCase().replace(/\s/g,"")===r[2]);
  return o?[String(m.marketId),String(o.outcomeId)]:null;
}
async function oddsFor(id,h,a,utc){
  const cached=LS.get("op_od_"+id);if(cached){OD[id]=cached;return {ok:true,o:cached}}
  const t=new Date(utc).getTime(),d1=new Date(t-864e5).toISOString().slice(0,10),d2=new Date(t+864e5).toISOString().slice(0,10),ck="op_fx_"+d1;
  let fx=LS.get(ck);
  if(!fx){fx=await opget(`fixtures?sportId=10&from=${d1}&to=${d2}&hasOdds=true`);LS.set(ck,fx,3*36e5)}
  const L=Array.isArray(fx)?fx:(fx.fixtures||fx.data||[]);
  let best=null,bs=0;
  L.forEach(f=>{if(Math.abs(fts(f)-t)>36e5*20)return;const s1=sim(h,fnm(f,1))+sim(a,fnm(f,2));if(s1>bs){bs=s1;best=f}});
  if(!best||bs<1.4)return {ok:false,msg:"No encontré este partido en OddsPapi."};
  await catalog();
  const od=await opget(`odds?fixtureId=${encodeURIComponent(best.fixtureId||best.id)}&bookmakers=${BK}`);
  const b=(od.bookmakerOdds||{})[BK];
  if(!b)return {ok:false,msg:"Betano todavía no tiene cuotas para este partido."};
  const o={};
  Object.keys(OPMAP).forEach(k=>{const r=resolve(k);if(r){const p=price(b,r[0],r[1]);if(p)o[k]=p}});
  if(!o["1"]){const f=[["1","101","101"],["X","101","102"],["2","101","103"],["O25","1010","1010"],["U25","1010","1011"],["B","104","104"],["N","104","105"]];f.forEach(([k,m,x])=>{if(!o[k]){const p=price(b,m,x);if(p)o[k]=p}})}
  if(!Object.keys(o).length)return {ok:false,msg:"Betano respondió pero sin estos mercados."};
  OD[id]=o;LS.set("op_od_"+id,o,2*36e5);
  return {ok:true,o};
}
const fillSlip=()=>{let n=0;S.slip.forEach(x=>{const o=OD[x.id];if(o&&o[x.mk]&&!x.odds){x.odds=o[x.mk];n++}});if(n)save();return n};
async function fetchOdds(i){
  const m=D.n[i];ODmsg[m.id]="Buscando...";draw();
  try{const r=await oddsFor(m.id,m.homeTeam.name,m.awayTeam.name,m.utcDate);
    ODmsg[m.id]=r.ok?"Cuotas de Betano vía OddsPapi. Confirmalas en tu Betano antes de apostar.":r.msg;fillSlip();
  }catch(e){ODmsg[m.id]="No se pudo traer la cuota ("+esc(e.message)+")."}
  draw();
}
let SLmsg="";
async function fetchSlipOdds(){
  const todo=S.slip.filter(x=>!x.odds);if(!todo.length){toast("Ya tenés todas las cuotas cargadas");return}
  SLmsg="Buscando cuotas de Betano...";draw();
  let ok=0,miss=[];
  for(const x of todo){
    const parts=String(x.d).split(" vs "),h=x.h||parts[0],a=x.a||parts[1],u=x.u||(D&&(D.n.find(m=>m.id===x.id)||{}).utcDate);
    if(!u){miss.push(x.l+" (abrí su liga en Partidos)");continue}
    try{const r=await oddsFor(x.id,h,a,u);if(r.ok&&r.o[x.mk]){x.odds=r.o[x.mk];ok++}else miss.push(x.l+(r.ok?" (Betano no ofrece ese mercado acá)":" ("+r.msg+")"))}
    catch(e){miss.push(x.l+" (error "+esc(e.message)+")")}
  }
  save();
  SLmsg=(ok?`Se cargaron ${ok} cuota${ok>1?"s":""}. `:"")+(miss.length?"Sin cuota automática: "+miss.join("; ")+". Cargalas a mano.":"")+" Confirmalas en tu Betano.";
  draw();
}
const G=[];
const add=(g,k,l,f,ht)=>G.push({g,k,l,f,ht:!!ht});
const T=(h)=>h;
// Resultado
add("Resultado final","1",(h,a)=>"Gana "+h,(i,j)=>i>j);
add("Resultado final","X",(h,a)=>"Empate",(i,j)=>i===j);
add("Resultado final","2",(h,a)=>"Gana "+a,(i,j)=>i<j);
add("Doble oportunidad","1X",(h,a)=>h+" o empate",(i,j)=>i>=j);
add("Doble oportunidad","X2",(h,a)=>a+" o empate",(i,j)=>i<=j);
add("Doble oportunidad","12",(h,a)=>"Gana alguno (sin empate)",(i,j)=>i!==j);
add("Empate anula apuesta","DNB1",(h,a)=>h+" (si empata, se devuelve)",(i,j)=>i>j,0);
add("Empate anula apuesta","DNB2",(h,a)=>a+" (si empata, se devuelve)",(i,j)=>i<j,0);
// Goles totales
[0.5,1.5,2.5,3.5,4.5,5.5].forEach(L=>{const t=String(L).replace(".","");add("Goles totales","O"+t,()=>"Más de "+String(L).replace(".",",")+" goles",(i,j)=>i+j>L);add("Goles totales","U"+t,()=>"Menos de "+String(L).replace(".",",")+" goles",(i,j)=>i+j<L)});
for(let n=0;n<=5;n++)add("Goles exactos","TG"+n,()=>n===5?"5 o más goles":"Exactamente "+n+(n===1?" gol":" goles"),n===5?(i,j)=>i+j>=5:(i,j)=>i+j===n);
add("Goles exactos","IMP",()=>"Cantidad impar de goles",(i,j)=>(i+j)%2===1);
add("Goles exactos","PAR",()=>"Cantidad par de goles",(i,j)=>(i+j)%2===0);
// Ambos marcan
add("Ambos marcan","B",()=>"Ambos marcan: Sí",(i,j)=>i>0&&j>0);
add("Ambos marcan","N",()=>"Ambos marcan: No",(i,j)=>i===0||j===0);
add("Ambos marcan","B1",(h,a)=>"Ambos marcan y gana "+h,(i,j)=>i>0&&j>0&&i>j);
add("Ambos marcan","B2",(h,a)=>"Ambos marcan y gana "+a,(i,j)=>i>0&&j>0&&i<j);
add("Ambos marcan","BX",()=>"Ambos marcan y empatan",(i,j)=>i>0&&j>0&&i===j);
// Goles por equipo
add("Goles por equipo","HG",(h,a)=>"Marca "+h,(i,j)=>i>0);
add("Goles por equipo","AG",(h,a)=>"Marca "+a,(i,j)=>j>0);
add("Goles por equipo","HO15",(h,a)=>h+": más de 1,5 goles",(i,j)=>i>1);
add("Goles por equipo","AO15",(h,a)=>a+": más de 1,5 goles",(i,j)=>j>1);
add("Goles por equipo","HO25",(h,a)=>h+": más de 2,5 goles",(i,j)=>i>2);
add("Goles por equipo","AO25",(h,a)=>a+": más de 2,5 goles",(i,j)=>j>2);
add("Goles por equipo","HCS",(h,a)=>"Arco en cero de "+h,(i,j)=>j===0);
add("Goles por equipo","ACS",(h,a)=>"Arco en cero de "+a,(i,j)=>i===0);
add("Goles por equipo","HWN",(h,a)=>"Gana "+h+" sin recibir goles",(i,j)=>i>j&&j===0);
add("Goles por equipo","AWN",(h,a)=>"Gana "+a+" sin recibir goles",(i,j)=>j>i&&i===0);
// Resultado y goles
[["1","Gana","h"],["X","Empate",""],["2","Gana","a"]].forEach(([r,w,x])=>{[["O25","más de 2,5",(g)=>g>2],["U25","menos de 2,5",(g)=>g<3]].forEach(([c,t,fn])=>{
 const res=(i,j)=>r==="1"?i>j:r==="2"?i<j:i===j;
 add("Resultado + goles","R"+r+c,(h,a)=>(r==="1"?"Gana "+h:r==="2"?"Gana "+a:"Empate")+" y "+t+" goles",(i,j)=>res(i,j)&&fn(i+j))})});
// Handicap europeo
add("Hándicap","H1m1",(h,a)=>h+" gana por 2 o más",(i,j)=>i-j>=2);
add("Hándicap","H2m1",(h,a)=>a+" gana por 2 o más",(i,j)=>j-i>=2);
add("Hándicap","H1p1",(h,a)=>h+" +1 (no pierde por 2 o más)",(i,j)=>i-j>-2);
add("Hándicap","H2p1",(h,a)=>a+" +1 (no pierde por 2 o más)",(i,j)=>j-i>-2);
// Marcador exacto
for(let i=0;i<=3;i++)for(let j=0;j<=3;j++)add("Marcador exacto","CS"+i+j,()=>"Resultado "+i+"-"+j,(x,y)=>x===i&&y===j);
// Primer tiempo (aproximación)
add("Primer tiempo (aprox.)","H1",(h,a)=>"1T: gana "+h,(i,j)=>i>j,1);
add("Primer tiempo (aprox.)","HX",()=>"1T: empate",(i,j)=>i===j,1);
add("Primer tiempo (aprox.)","H2",(h,a)=>"1T: gana "+a,(i,j)=>i<j,1);
add("Primer tiempo (aprox.)","HO05",()=>"1T: más de 0,5 goles",(i,j)=>i+j>0,1);
add("Primer tiempo (aprox.)","HO15",()=>"1T: más de 1,5 goles",(i,j)=>i+j>1,1);
add("Primer tiempo (aprox.)","HU15",()=>"1T: menos de 1,5 goles",(i,j)=>i+j<2,1);
const MKT=G.map(x=>[x.k,x.g]);
const MKG=[...new Set(G.map(x=>x.g))];
const MK={};
const LBL=(k,h,a)=>{const x=G.find(y=>y.k===k);return x?x.l(h,a):k};

function model(h,a){
  const A=D.T[h]||{gf:0,ga:0,n:0},B=D.T[a]||{gf:0,ga:0,n:0},avg=(D.hg+D.ag)/2,k=3;
  const att=t=>(t.gf+k*avg)/(t.n+k)/avg,def=t=>(t.ga+k*avg)/(t.n+k)/avg;
  const lh=D.hg*att(A)*def(B),la=D.ag*att(B)*def(A);
  const mat=(x,y,N)=>{let tot=0;const m=[];for(let i=0;i<=N;i++){m[i]=[];for(let j=0;j<=N;j++){m[i][j]=pois(x,i)*pois(y,j);tot+=m[i][j]}}return{m,tot,N}};
  const F=mat(lh,la,10),H=mat(lh*.45,la*.45,8),P={};
  G.forEach(x=>{const Q=x.ht?H:F;let s=0;for(let i=0;i<=Q.N;i++)for(let j=0;j<=Q.N;j++)if(x.f(i,j))s+=Q.m[i][j];P[x.k]=s/Q.tot});
  P.DNB1=P["1"]/(P["1"]+P["2"]);P.DNB2=P["2"]/(P["1"]+P["2"]);
  return{lh,la,P};
}
async function load(){
  try{Object.keys(localStorage).filter(k=>k.startsWith("op_od_")).forEach(k=>{const v=LS.get(k);if(v)OD[k.slice(6)]=v})}catch(e){}
  D=null;err="";draw();
  try{
    const [f,n]=await Promise.all([get(`competitions/${lg}/matches?status=FINISHED`),get(`competitions/${lg}/matches?status=SCHEDULED,TIMED`)]);
    const T={};let hg=0,ag=0,N=0;
    const add=(nm,gf,ga)=>{const t=T[nm]=T[nm]||{gf:0,ga:0,n:0,r:[]};t.gf+=gf;t.ga+=ga;t.n++;t.r.push(gf>ga?"G":gf<ga?"P":"E")};
    f.sort((x,y)=>new Date(y.utcDate)-new Date(x.utcDate)).forEach(m=>{
      const h=m.score.fullTime.home,a=m.score.fullTime.away;if(h==null||a==null)return;
      hg+=h;ag+=a;N++;add(m.homeTeam.name,h,a);add(m.awayTeam.name,a,h);
    });
    D={T,hg:N?hg/N:1.5,ag:N?ag/N:1.2,N,n:n.sort((x,y)=>new Date(x.utcDate)-new Date(y.utcDate)).slice(0,12)};
  }catch(e){err=e.message}
  draw();
}
function loss(d){
  const t0=d===1?new Date().setHours(0,0,0,0):Date.now()-7*864e5;
  const n=S.bets.filter(b=>b.t>=t0&&b.r!=="N").reduce((a,b)=>a+(b.r==="G"?b.s*(b.o-1):-b.s),0);
  return Math.max(0,-n);
}
function lim(){
  let h="";
  if(S.ld>0&&loss(1)>=S.ld)h+='<p class="bad"><b>Llegaste a tu límite diario de pérdida. Pará por hoy.</b></p>';
  if(S.lw>0&&loss(7)>=S.lw)h+='<p class="bad"><b>Llegaste a tu límite semanal de pérdida. Pará hasta la semana próxima.</b></p>';
  return h;
}
function calc(){
  const L=S.slip,p=L.reduce((a,x)=>a*x.p,1),od=L.reduce((a,x)=>a*(+x.odds||0),1),ok=L.length>0&&L.every(x=>+x.odds>1),ev=ok?p*od-1:null;
  const mx=S.cap*S.pct/100,k=ok&&ev>0?ev/(od-1)/4:0,sug=S.cap?Math.min(S.cap*k,mx):0;
  return{p,od,ok,ev,mx,sug};
}
const dots=r=>`<span class="dots">${(r||[]).slice(0,5).map(x=>`<span class="${x}">${x}</span>`).join("")}</span>`;

function vMatches(){
  if(err)return`<div class="card bad">No se pudieron cargar los datos (${esc(err)}). Revisá la clave de API y que la liga esté habilitada en fd.js.</div>`;
  if(!D)return'<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  if(!D.n.length)return'<div class="empty"><b>🏟️</b>No hay partidos próximos en esta liga.</div>';
  const keys=[...new Set(D.n.map(m=>dkey(m.utcDate)))];
  const chips=`<div class="days"><button class="day${DAY==="all"?" on":""}" data-d="all">Todos</button>${keys.map(k=>{const m=D.n.find(x=>dkey(x.utcDate)===k);return`<button class="day${DAY===k?" on":""}" data-d="${k}">${dlab(m.utcDate)}</button>`}).join("")}</div>`;
  const cr=(t)=>t.crest?`<div class="cr"><img src="${esc(t.crest)}" alt="" loading="lazy" onerror="this.remove()"></div>`:`<div class="cr">${esc((t.tla||t.name||"?").slice(0,3))}</div>`;
  return chips+D.n.map((m,i)=>({m,i})).filter(({m})=>DAY==="all"||dkey(m.utcDate)===DAY).map(({m,i})=>{
    const h=m.homeTeam.name,a=m.awayTeam.name,M=model(h,a),P=M.P,A=D.T[h]||{r:[],n:0},B=D.T[a]||{r:[],n:0},low=Math.min(A.n,B.n)<5;
    const cur=MK[m.id]||"1",on=S.slip.find(x=>x.id===m.id),o=OD[m.id]||{},c=o[cur],vp=c?P[cur]*c-1:null;
    const sel=`<select class="lsel mksel" data-m="${m.id}">${MKG.map(g=>`<optgroup label="${esc(g)}">${G.filter(x=>x.g===g).map(x=>`<option value="${x.k}"${x.k===cur?" selected":""}>${esc(x.l(m.homeTeam.shortName||h,m.awayTeam.shortName||a))} · ${pc(P[x.k])}</option>`).join("")}</optgroup>`).join("")}</select>`;
    const inn=on&&on.mk===cur,odv=1/P[cur];
    const mk=`<div class="mkbox">${sel}<div class="row" style="margin-top:10px"><div><div class="mu">Probabilidad del modelo</div><b style="font-size:24px">${pc(P[cur])}</b></div><div style="text-align:right"><div class="mu">Cuota justa</div><b style="font-size:24px">${odv.toFixed(2)}</b></div></div><button class="btn${inn?" ghost":""}" data-a="pick" data-i="${i}" data-k="${cur}">${inn?"Quitar de la combinada":on?"Cambiar mi selección por esta":"Agregar a la combinada"}</button></div>`;
    return`<div class="card"><div class="mu" style="text-align:center">${new Date(m.utcDate).toLocaleString("es-AR",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</div>
    <div class="teams"><div class="tm">${cr(m.homeTeam)}${esc(m.homeTeam.shortName||h)}<div class="dots">${(A.r||[]).slice(0,5).map(x=>`<span class="${x}">${x}</span>`).join("")}</div></div>
    <div class="vs">xG<b>${M.lh.toFixed(1)} - ${M.la.toFixed(1)}</b></div>
    <div class="tm">${cr(m.awayTeam)}${esc(m.awayTeam.shortName||a)}<div class="dots">${(B.r||[]).slice(0,5).map(x=>`<span class="${x}">${x}</span>`).join("")}</div></div></div>
    <div class="bar"><i style="width:${P["1"]*100}%;background:var(--ac)"></i><i style="width:${P.X*100}%;background:var(--mu)"></i><i style="width:${P["2"]*100}%;background:var(--wn)"></i></div>
    <div class="pr"><span>Local ${pc(P["1"])}</span><span>Empate ${pc(P.X)}</span><span>Visita ${pc(P["2"])}</span></div>
    ${mk}
    ${c?`<div class="odd"><span>Betano <b>${c.toFixed(2)}</b> <span class="mu">(justa ${(1/P[cur]).toFixed(2)})</span></span><span class="val ${vp>0?"up":"dn"}">${vp>0?"+":""}${(vp*100).toFixed(0)}% valor</span></div>`:""}
    <div class="row" style="margin-top:10px"><button class="sm" data-a="odds" data-i="${i}">Traer cuotas de Betano</button><span class="mu" style="text-align:right;flex:1">${esc(ODmsg[m.id]||"")}</span></div>
    ${low?'<div class="mu wn" style="margin-top:8px">Pocos partidos jugados: estimación poco confiable.</div>':""}</div>`}).join("");
}
function vSlip(){
  if(!S.slip.length)return'<div class="card mu">Tu combinada está vacía. En Partidos, tocá una probabilidad para agregarla (una selección por partido).</div>';
  const c=calc(),n=S.slip.length,L=lim(),falt=S.slip.filter(x=>!x.odds).length;
  return (falt?`<div class="card"><div class="row"><div><b>Cuotas de Betano</b><div class="mu">Faltan ${falt} cuota${falt>1?"s":""}. Cada partido nuevo gasta 1 consulta de OddsPapi.</div></div></div><button class="btn" data-a="slipodds">Traer cuotas de Betano</button>${SLmsg?`<div class="mu" style="margin-top:8px">${SLmsg}</div>`:""}</div>`:(SLmsg?`<div class="card mu">${SLmsg}</div>`:""))+S.slip.map((x,i)=>`<div class="card"><div class="row"><div><b>${esc(x.l)}</b><div class="mu">${esc(x.d)}</div></div><button class="sm" data-a="rm" data-i="${i}">Quitar</button></div>
  <div class="mu" style="margin-top:8px">Modelo: ${pc(x.p)} (cuota justa ${(1/x.p).toFixed(2)})</div>
  <label class="mu">Cuota que paga tu casa</label><input type="number" step="0.01" min="1.01" value="${x.odds}" data-o="${i}" placeholder="Ej: 2.10"></div>`).join("")+
  `<div class="card"><div class="ring"><svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--c3)" stroke-width="12"/><circle cx="60" cy="60" r="52" fill="none" stroke="${c.p<.2?"var(--bad)":c.p<.45?"var(--wn)":"var(--ac)"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(c.p*326.7).toFixed(1)} 326.7"/></svg><b>${(c.p*100).toFixed(0)}%</b></div><div class="mu" style="text-align:center;margin-bottom:10px">Chance de acertar las ${n}</div><div class="k"><div><span class="mu">Prob. de acertar las ${n}</span><b class="${c.p<.2?"bad":""}">${(c.p*100).toFixed(1)}%</b></div><div><span class="mu">Falla al menos una</span><b>${((1-c.p)*100).toFixed(1)}%</b></div>
  <div><span class="mu">Cuota total</span><b>${c.ok?c.od.toFixed(2):"-"}</b></div><div><span class="mu">Valor esperado por $1</span><b class="${c.ev>0?"ok":"bad"}">${c.ok?(c.ev>=0?"+":"")+c.ev.toFixed(2):"-"}</b></div></div>
  <p class="mu">${n>1?"Cada selección que sumás multiplica el margen de la casa y baja la chance de acertar. ":""}Se supone que los partidos son independientes y que el modelo acierta. ${c.ok?(c.ev>0?"Hay ventaja solo si esa estimación es correcta.":"Con estos números, a la larga se pierde plata."):"Cargá las cuotas para ver el valor esperado."}</p>
  <label class="mu">Monto a apostar ${S.cap?`(sugerido ${mon(c.sug)}, tope ${mon(c.mx)})`:"(cargá tu capital en Mi dinero)"}</label><input type="number" id="stk" value="${S.stake}" placeholder="$">
  ${L}<button class="btn" data-a="reg" ${L?"disabled":""}>Registrar apuesta</button></div>`;
}
function vMoney(){
  const R=S.bets.filter(b=>b.r==="G"||b.r==="P"),pf=R.reduce((a,b)=>a+(b.r==="G"?b.s*(b.o-1):-b.s),0),st=R.reduce((a,b)=>a+b.s,0),w=R.filter(b=>b.r==="G").length;
  const lr=R.length?R[R.length-1].r:"";let rs=0;for(let i=R.length-1;i>=0&&R[i].r===lr;i--)rs++;
  return lim()+`<div class="card"><div class="k"><div><span class="mu">Resultado</span><b class="${pf>=0?"ok":"bad"}">${mon(pf)}</b></div><div><span class="mu">ROI</span><b>${st?(pf/st*100).toFixed(1)+"%":"-"}</b></div><div><span class="mu">Acierto</span><b>${R.length?Math.round(w/R.length*100)+"%":"-"}</b></div><div><span class="mu">Racha</span><b>${rs?rs+(lr==="G"?" ganadas":" perdidas"):"-"}</b></div></div></div>
  <div class="card"><b>Mi banca</b><label class="mu">Capital total ($)</label><input id="cp" type="number" value="${S.cap||""}"><label class="mu">Monto por apuesta (% del capital, recomendado 1-2)</label><input id="pp" type="number" step="0.1" value="${S.pct}"><label class="mu">Límite de pérdida diario ($)</label><input id="ld" type="number" value="${S.ld||""}"><label class="mu">Límite de pérdida semanal ($)</label><input id="lw" type="number" value="${S.lw||""}"><button class="btn" data-a="cfg">Guardar</button></div>`+
  S.bets.map((b,i)=>({b,i})).reverse().map(({b,i})=>`<div class="card"><div class="row"><b>${b.n>1?"Combinada de "+b.n:"Simple"}</b><span class="mu">${new Date(b.t).toLocaleDateString("es-AR")}</span></div><div class="mu">${esc(b.d)}</div><div class="row" style="margin-top:6px"><span>${mon(b.s)} a ${b.o.toFixed(2)}</span><b class="${b.r==="G"?"ok":b.r==="P"?"bad":""}">${b.r==="?"?"Pendiente":b.r==="G"?"Ganó +"+mon(b.s*(b.o-1)):b.r==="P"?"Perdió -"+mon(b.s):"Nula"}</b></div>${b.r==="?"?`<div class="row" style="margin-top:8px"><button class="sm" data-a="res" data-i="${i}" data-r="G">Ganó</button><button class="sm" data-a="res" data-i="${i}" data-r="P">Perdió</button><button class="sm" data-a="res" data-i="${i}" data-r="N">Nula</button></div>`:""}<button class="sm" style="margin-top:8px" data-a="del" data-i="${i}">Borrar</button></div>`).join("");
}
function draw(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  document.querySelectorAll(".pill").forEach(b=>b.classList.toggle("on",b.dataset.l===lg));
  $("#sl").textContent=S.slip.length?"("+S.slip.length+")":"";
  const f=$("#fab");if(S.slip.length&&tab==="m"){const c=calc();f.innerHTML=`🧾 Mi combinada (${S.slip.length})<span>${(c.p*100).toFixed(0)}% de acertar${c.ok?" · cuota "+c.od.toFixed(2):""}</span>`;f.classList.add("show")}else f.classList.remove("show");
  $("#app").innerHTML=tab==="m"?vMatches():tab==="c"?vSlip():vMoney();
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-a],[data-t],[data-l],[data-d]");if(!t)return;
  if(t.dataset.d){DAY=t.dataset.d;draw();return}
  if(t.dataset.t){tab=t.dataset.t;draw();scrollTo(0,0);return}
  if(t.dataset.l){lg=t.dataset.l;load();return}
  const a=t.dataset.a,i=+t.dataset.i;
  if(a==="odds"){fetchOdds(i);return}
  if(a==="slipodds"){fetchSlipOdds();return}
  if(a==="pick"){
    const m=D.n[i],k=t.dataset.k,on=S.slip.find(x=>x.id===m.id);
    if(on&&on.mk===k){S.slip=S.slip.filter(x=>x.id!==m.id);MK[m.id]=k;save();draw();toast("Quitada de la combinada");return}
    MK[m.id]=k;t.dataset.k=k;
    const h=m.homeTeam.name,aw=m.awayTeam.name,M=model(h,aw),it={id:m.id,mk:k,h,a:aw,u:m.utcDate,d:h+" vs "+aw,l:LBL(k,h,aw),p:M.P[k],odds:(OD[m.id]&&OD[m.id][k])||""},ex=S.slip.findIndex(s=>s.id===m.id);
    if(ex>=0)S.slip[ex]=it;else S.slip.push(it);
    save();draw();toast("Agregada: "+it.l);if(navigator.vibrate)navigator.vibrate(12);return;
  }
  if(a==="sel"){
    const m=D.n[i],k=MK[D.n[i].id]||"1",h=m.homeTeam.name,aw=m.awayTeam.name,M=model(h,aw),ex=S.slip.findIndex(s=>s.id===m.id);
    if(ex>=0&&S.slip[ex].mk===k)S.slip.splice(ex,1);
    else{const it={id:m.id,mk:k,h,a:aw,u:m.utcDate,d:h+" vs "+aw,l:LBL(k,h,aw),p:M.P[k],odds:(OD[m.id]&&OD[m.id][k])||""};if(ex>=0)S.slip[ex]=it;else S.slip.push(it)}
    save();draw();
  }else if(a==="rm"){S.slip.splice(i,1);save();draw()}
  else if(a==="reg"){
    const c=calc(),s=+$("#stk").value;
    if(!c.ok||!(s>0)){alert("Cargá las cuotas y el monto.");return}
    if(S.cap&&s>c.mx*1.001&&!confirm("Superás tu monto fijo ("+S.pct+"% del capital). ¿Seguro?"))return;
    S.bets.push({d:S.slip.map(x=>x.l).join(" + "),s:s,o:c.od,p:c.p,r:"?",t:Date.now(),n:S.slip.length});
    S.slip=[];S.stake="";save();tab="d";draw();scrollTo(0,0);
  }else if(a==="res"){S.bets[i].r=t.dataset.r;save();draw()}
  else if(a==="del"){S.bets.splice(i,1);save();draw()}
  else if(a==="cfg"){S.cap=+$("#cp").value||0;S.pct=Math.min(+$("#pp").value||1.5,100);S.ld=+$("#ld").value||0;S.lw=+$("#lw").value||0;save();draw()}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.o!==undefined){S.slip[+t.dataset.o].odds=t.value;save();draw()}
  else if(t.id==="stk"){S.stake=t.value;save()}
  else if(t.id==="lgsel"){lg=t.value;load()}
  else if(t.dataset.m!==undefined){MK[t.dataset.m]=t.value;draw()}
});
load();
</script></body></html>
