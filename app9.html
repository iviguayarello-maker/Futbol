<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={cap:0,pct:1.5,ld:0,lw:0,stake:"",bets:[],slip:[]},tab="m",lg="PL",D=null,err="";

const norm=t=>String(t||"").toLowerCase().replace("wolverhampton wanderers","wolves").replace("internazionale","inter").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\b(fc|cf|afc|sc|ac|as|cd|ud|sv|fk|the|club|de)\b/g," ").replace(/[^a-z0-9 ]/g," ").split(" ").filter(x=>x.length>1);
const sim=(a,b)=>{const A=norm(a),B=norm(b);if(!A.length||!B.length)return 0;const i=A.filter(x=>B.some(y=>y===x||(x.length>=3&&y.length>=3&&(x.startsWith(y)||y.startsWith(x))))).length;return i/Math.min(A.length,B.length)};
const fnm=(f,k)=>{const c=k===1?[f.participant1Name,f.homeTeamName,f.homeTeam&&f.homeTeam.name,f.home&&f.home.name,f.team1Name]:[f.participant2Name,f.awayTeamName,f.awayTeam&&f.awayTeam.name,f.away&&f.away.name,f.team2Name];return c.find(x=>typeof x==="string")||""};
const fts=f=>new Date(f.startTime||f.trueStartTime||f.startAt||f.date||0).getTime();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const opget=async(q,tries=2)=>{const r=await fetch("/.netlify/functions/op?p="+encodeURIComponent(q));if(!r.ok){let m="";try{const j=await r.json();m=j.error||""}catch(e){}if(r.status===429&&tries>0){await sleep(6000);return opget(q,tries-1)}throw new Error(r.status+(m?": "+m:""))}await sleep(3500);return r.json()};

let CAT=null;
async function catalog(){
  if(CAT)return CAT;CAT=LS.get("op_cat");
  if(!CAT){const r=await opget("markets?language=en");CAT=Array.isArray(r)?r.filter(m=>!m.sportId||m.sportId===10):[];LS.set("op_cat",CAT,30*864e5)}
  return CAT;

// Para cada mercado de la app: [nombre del mercado en OddsPapi, línea, nombre del resultado]
const OPMAP={"1":["full time result",0,"1"],X:["full time result",0,"x"],"2":["full time result",0,"2"],
 "1X":["double chance",null,"1x"],X2:["double chance",null,"x2"],"12":["double chance",null,"12"],
 DNB1:["draw no bet",null,"1"],DNB2:["draw no bet",null,"2"],
 B:["both teams to score",null,"yes"],N:["both teams to score",null,"no"]};
[0.5,1.5,2.5,3.5,4.5,5.5].forEach(L=>{const t=String(L).replace(".","");OPMAP["O"+t]=["over under full time",L,"over"];OPMAP["U"+t]=["over under full time",L,"under"]});
function resolve(k){
  const r=OPMAP[k];if(!r||!CAT)return null;
  const m=CAT.find(x=>String(x.marketName||"").toLowerCase()===r[0]&&(r[1]===null||Math.abs((+x.handicap||0)-r[1])<1e-6));
  if(!m)return null;
  const o=(m.outcomes||[]).find(y=>String(y.outcomeName||"").toLowerCase().replace(/\s/g,"")===r[2]);
  return o?[String(m.marketId),String(o.outcomeId)]:null;
}

const BKNAME=k=>String(k).replace(/\.(br|ar|com|es|it|co\.uk|ca|mx)$/i,"").replace(/^./,c=>c.toUpperCase());
const med=a=>{const s=[...a].sort((x,y)=>x-y),n=s.length;return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2};
async function oddsFor(id,h,a,utc){
  const cached=LS.get("op_od3_"+id);if(cached){OD[id]=cached.o;ODSRC[id]=cached.src;return {ok:true,o:cached.o}}
  const t=new Date(utc).getTime(),d1=new Date(t).toISOString().slice(0,10),d2=new Date(t+864e5).toISOString().slice(0,10),ck="op_fx2_"+d1;
  let fx=LS.get(ck);
  if(!fx){fx=await opget(`fixtures?sportId=10&from=${d1}&to=${d2}&hasOdds=true`);LS.set(ck,fx,3*36e5)}
  const L=Array.isArray(fx)?fx:(fx.fixtures||fx.data||[]);
  let best=null,bs=0;
  L.forEach(f=>{if(Math.abs(fts(f)-t)>36e5*20)return;const s1=sim(h,fnm(f,1))+sim(a,fnm(f,2));if(s1>bs){bs=s1;best=f}});
  if(!best||bs<1.4)return {ok:false,msg:"No encontré este partido en OddsPapi."};
  await catalog();
  const R={};Object.keys(OPMAP).forEach(k=>{const r=resolve(k);if(r)R[k]=r});
  if(!R["1"])Object.assign(R,{"1":["101","101"],X:["101","102"],"2":["101","103"],O25:["1010","1010"],U25:["1010","1011"],B:["104","104"],N:["104","105"]});
  const mk=[...new Set(Object.values(R).map(r=>r[0]))].join(",");
  const od=await fetch("/.netlify/functions/op?p="+encodeURIComponent(`odds?fixtureId=${best.fixtureId||best.id}`)+"&mk="+mk).then(async r=>{if(!r.ok){let m="";try{m=(await r.json()).error||""}catch(e){}throw new Error(r.status+(m?": "+m:""))}await sleep(3500);return r.json()});
  const books=od.odds||{},keys=Object.keys(books);
  if(!keys.length)return {ok:false,msg:"Ninguna casa publicó cuotas para este partido todavía."};
  const o={},src={};
  Object.entries(R).forEach(([k,[m,x]])=>{
    const have=keys.filter(b=>books[b][m]&&books[b][m][x]);if(!have.length)return;
    let pickB=null;for(const re of PREF){pickB=have.find(b=>re.test(b));if(pickB)break}
    if(pickB){o[k]=books[pickB][m][x];src[k]=BKNAME(pickB)}
    else{o[k]=+med(have.map(b=>books[b][m][x])).toFixed(2);src[k]=have.length>1?`mediana de ${have.length} casas`:BKNAME(have[0])}
  });
  if(!Object.keys(o).length)return {ok:false,msg:"Las casas no ofrecen estos mercados para este partido."};
  OD[id]=o;ODSRC[id]=src;LS.set("op_od3_"+id,{o,src},2*36e5);
  return {ok:true,o};
}

async function fetchSlipOdds(){

  let ok=0,miss=[];
  for(const x of todo){
    const parts=String(x.d).split(" vs "),h=x.h||parts[0],a=x.a||parts[1],u=x.u||(D&&(D.n.find(m=>m.id===x.id)||{}).utcDate);

}

function model(h,a){
  const A=D.T[h]||{gf:0,ga:0,n:0},B=D.T[a]||{gf:0,ga:0,n:0},avg=(D.hg+D.ag)/2,k=3;
  const att=t=>(t.gf+k*avg)/(t.n+k)/avg,def=t=>(t.ga+k*avg)/(t.n+k)/avg;

  const F=mat(lh,la,10),H=mat(lh*.45,la*.45,8),P={};
  G.forEach(x=>{const Q=x.ht?H:F;let s=0;for(let i=0;i<=Q.N;i++)for(let j=0;j<=Q.N;j++)if(x.f(i,j))s+=Q.m[i][j];P[x.k]=s/Q.tot});

}

  `<div class="card"><div class="ring"><svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--c3)" stroke-width="12"/><circle cx="60" cy="60" r="52" fill="none" stroke="${c.p<.2?"var(--bad)":c.p<.45?"var(--wn)":"var(--ac)"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(c.p*326.7).toFixed(1)} 326.7"/></svg><b>${(c.p*100).toFixed(0)}%</b></div><div class="mu" style="text-align:center;margin-bottom:10px">${n>1?`Chance de acertar las ${n}`:"Chance de acertar"}</div><div class="k"><div><span class="mu">${n>1?`Prob. de acertar las ${n}`:"Prob. de acertar"}</span><b class="${c.p<.2?"bad":""}">${(c.p*100).toFixed(1)}%</b></div><div><span class="mu">Falla al menos una</span><b>${((1-c.p)*100).toFixed(1)}%</b></div>
  <div><span class="mu">Cuota total</span><b>${c.ok?c.od.toFixed(2):"-"}</b></div><div><span class="mu">Valor esperado por $1</span><b class="${c.ev>0?"ok":"bad"}">${c.ok?(c.ev>=0?"+":"")+c.ev.toFixed(2):"-"}</b></div></div>
  <p class="mu">${n>1?"Cada selección que sumás multiplica el margen de la casa y baja la chance de acertar. ":""}Se supone que los partidos son independientes y que el modelo acierta. ${c.ok?(c.ev>0?"Hay ventaja solo si esa estimación es correcta.":"Con estos números, a la larga se pierde plata."):"Cargá las cuotas para ver el valor esperado."}</p>
  <label class="mu">Monto a apostar ${S.cap?`(sugerido ${mon(c.sug)}, tope ${mon(c.mx)})`:"(cargá tu capital en Mi banca)"}</label><input type="number" id="stk" value="${S.stake}" placeholder="$">
  <button class="btn ai" data-a="aislip">✨ Analizar mi combinada con IA</button>${L}<button class="btn" data-a="reg" ${L?"disabled":""}>Registrar apuesta</button></div>`;
}
function vMoney(){
  const R=S.bets.filter(b=>b.r==="G"||b.r==="P"),pf=R.reduce((a,b)=>a+(b.r==="G"?b.s*(b.o-1):-b.s),0),st=R.reduce((a,b)=>a+b.s,0),w=R.filter(b=>b.r==="G").length;
  const lr=R.length?R[R.length-1].r:"";let rs=0;for(let i=R.length-1;i>=0&&R[i].r===lr;i--)rs++;
  return lim()+`<div class="card"><div class="k"><div><span class="mu">Resultado</span><b class="${pf>=0?"ok":"bad"}">${mon(pf)}</b></div><div><span class="mu">ROI</span><b>${st?(pf/st*100).toFixed(1)+"%":"-"}</b></div><div><span class="mu">Acierto</span><b>${R.length?Math.round(w/R.length*100)+"%":"-"}</b></div><div><span class="mu">Racha</span><b>${rs?rs+(lr==="G"?" ganadas":" perdidas"):"-"}</b></div></div></div>
  <div class="card"><b>Mi banca</b><label class="mu">Capital total ($)</label><input id="cp" type="number" value="${S.cap||""}"><label class="mu">Monto por apuesta (% del capital, recomendado 1-2)</label><input id="pp" type="number" step="0.1" value="${S.pct}"><label class="mu">Límite de pérdida diario ($)</label><input id="ld" type="number" value="${S.ld||""}"><label class="mu">Límite de pérdida semanal ($)</label><input id="lw" type="number" value="${S.lw||""}"><button class="btn" data-a="cfg">Guardar</button></div>`+
  S.bets.map((b,i)=>({b,i})).reverse().map(({b,i})=>`<div class="card"><div class="row"><b>${b.n>1?"Combinada de "+b.n:"Simple"}</b><span class="mu">${new Date(b.t).toLocaleDateString("es-AR")}</span></div><div class="mu">${esc(b.d)}</div><div class="row" style="margin-top:6px"><span>${mon(b.s)} a ${b.o.toFixed(2)}</span><b class="${b.r==="G"?"ok":b.r==="P"?"bad":""}">${b.r==="?"?"Pendiente":b.r==="G"?"Ganó +"+mon(b.s*(b.o-1)):b.r==="P"?"Perdió -"+mon(b.s):"Nula"}</b></div>${b.r==="?"?`<div class="row" style="margin-top:8px"><button class="sm" data-a="res" data-i="${i}" data-r="G">Ganó</button><button class="sm" data-a="res" data-i="${i}" data-r="P">Perdió</button><button class="sm" data-a="res" data-i="${i}" data-r="N">Nula</button></div>`:""}<button class="sm" style="margin-top:8px" data-a="del" data-i="${i}">Borrar</button></div>`).join("");
}
function ctx(){
  const L=["Fecha y hora: "+new Date().toLocaleString("es-AR")];
  if(D&&D.n&&D.n.length){
    L.push(`Liga en pantalla: ${LGN[lg]||lg}. Próximos partidos (prob. del modelo; xG; forma últimos 5, G=ganó E=empató P=perdió; partidos jugados):`);
    D.n.slice(0,10).forEach(m=>{const h=m.homeTeam.name,a=m.awayTeam.name,M=model(h,a),P=M.P,A=D.T[h]||{r:[],n:0},B=D.T[a]||{r:[],n:0},o=OD[m.id]||{};
      L.push(`- ${h} vs ${a} (${new Date(m.utcDate).toLocaleString("es-AR",{weekday:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}): local ${pc(P["1"])}, empate ${pc(P.X)}, visita ${pc(P["2"])}, +1.5 ${pc(P.O15)}, +2.5 ${pc(P.O25)}, ambos marcan ${pc(P.B)}; xG ${M.lh.toFixed(2)}-${M.la.toFixed(2)}; forma ${A.r.slice(0,5).join("")||"-"} / ${B.r.slice(0,5).join("")||"-"}; jugados ${A.n}/${B.n}`+(Object.keys(o).length?`; cuotas: ${Object.entries(o).slice(0,8).map(([k,v])=>k+"="+v).join(", ")}`:""))});
  }
  if(S.slip.length){const c=calc();L.push("Combinada del usuario:");S.slip.forEach(x=>L.push(`- ${x.l} (${x.d}): prob. modelo ${pc(x.p)}, cuota justa ${(1/x.p).toFixed(2)}, cuota ${x.odds||"sin cargar"}${x.src?" ("+x.src+")":""}`));
    L.push(`Total: prob. de acertar todas ${(c.p*100).toFixed(1)}%`+(c.ok?`, cuota total ${c.od.toFixed(2)}, valor esperado por $1 ${c.ev.toFixed(2)}`:", faltan cuotas"));}
  else L.push("Combinada del usuario: vacía.");
  const R=S.bets.filter(b=>b.r==="G"||b.r==="P"),pf=R.reduce((a,b)=>a+(b.r==="G"?b.s*(b.o-1):-b.s),0),st=R.reduce((a,b)=>a+b.s,0);
  L.push(`Banca: capital ${S.cap?mon(S.cap):"sin cargar"}, monto por apuesta ${S.pct}% (${S.cap?mon(S.cap*S.pct/100):"-"}), límite diario ${S.ld?mon(S.ld):"sin límite"}, semanal ${S.lw?mon(S.lw):"sin límite"}. Pérdida hoy ${mon(loss(1))}, últimos 7 días ${mon(loss(7))}.`);
  L.push(`Historial: ${R.length} apuestas resueltas, resultado ${mon(pf)}, ROI ${st?(pf/st*100).toFixed(1)+"%":"-"}; ${S.bets.filter(b=>b.r==="?").length} pendientes.`);
  return L.join("\n");
}
const md=t=>{const e=esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");const out=[];let ul=false;e.split(/\n/).forEach(l=>{const m=l.match(/^\s*[-•*]\s+(.*)/);if(m){if(!ul){out.push("<ul>");ul=true}out.push("<li>"+m[1]+"</li>")}else{if(ul){out.push("</ul>");ul=false}if(l.trim())out.push("<p>"+l+"</p>")}});if(ul)out.push("</ul>");return out.join("")};
async function ask(q){
  q=String(q||"").trim();if(!q||AIBUSY)return;
  CHAT.push({role:"user",content:q});AIBUSY=true;SHEET=null;tab="ai";draw();setTimeout(()=>scrollTo(0,document.body.scrollHeight),50);
  try{
    const r=await fetch("/.netlify/functions/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:CHAT.filter(x=>!x.err),context:ctx()})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||("error "+r.status));
    CHAT.push({role:"assistant",content:j.text});
  }catch(e){CHAT.push({role:"assistant",content:"No pude responder: "+e.message,err:true})}
  AIBUSY=false;saveChat();draw();setTimeout(()=>scrollTo(0,document.body.scrollHeight),50);
}
const LOGOSVG=document.querySelector(".logo").outerHTML;
function vAI(){
  const sug=["Analizá mi combinada","¿Qué partido de esta liga pinta para más goles?","¿Dónde ves más valor con las cuotas cargadas?","Explicame qué es el valor esperado","¿Cómo voy con mis apuestas?"];
  return`<div class="card"><div class="aih">${LOGOSVG}<div><b style="font-size:17px">Valora IA</b><div class="mu">Te explica los números de los partidos, tu combinada y tu banca. No adivina resultados.</div></div></div>
  ${CHAT.length?`<div class="row" style="margin-top:10px"><span class="mu">Usa los datos que ves en la app.</span><button class="sm" data-a="clearchat">Nueva charla</button></div>`:`<div class="sug">${sug.map(x=>`<button data-a="sug" data-q="${esc(x)}">${esc(x)}</button>`).join("")}</div>`}</div>
  <div class="chat">${CHAT.map(x=>`<div class="msg ${x.role==="user"?"u":"a"}${x.err?" e":""}">${x.role==="user"?esc(x.content):md(x.content)}</div>`).join("")}${AIBUSY?'<div class="msg a typing"><span></span><span></span><span></span></div>':""}</div><div style="height:90px"></div>`;
}
function draw(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  document.querySelectorAll(".pill").forEach(b=>b.classList.toggle("on",b.dataset.l===lg));
  $("#lgs").style.display=tab==="m"?"flex":"none";
  $("#sl").textContent=S.slip.length?S.slip.length:"";
  const f=$("#fab");if(S.slip.length&&tab==="m"&&SHEET===null){const c=calc();f.innerHTML=`🧾 Ver mi combinada (${S.slip.length})<span>${(c.p*100).toFixed(0)}% de acertar${c.ok?" · cuota "+c.od.toFixed(2):""}</span>`;f.classList.add("show")}else f.classList.remove("show");
  $("#app").innerHTML=tab==="m"?vMatches():tab==="c"?vSlip():tab==="ai"?vAI():vMoney();
  $("#foot").style.display=tab==="ai"?"none":"block";
  $("#sheetwrap").innerHTML=tab==="m"?vSheet():"";
  document.body.style.overflow=SHEET!==null&&tab==="m"?"hidden":"";
  const aw=$("#askwrap");
  if(tab==="ai"){if(!$("#aiq"))aw.innerHTML=`<div class="ask"><div class="row"><textarea id="aiq" rows="1" placeholder="Preguntale a Valora IA..."></textarea><button class="go" data-a="send" aria-label="Enviar">➤</button></div></div>`;$("#aiq").disabled=AIBUSY}else aw.innerHTML="";
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-a],[data-t],[data-l],[data-d]");if(!t)return;
  if(t.dataset.d){DAY=t.dataset.d;draw();return}
  if(t.dataset.t){tab=t.dataset.t;SHEET=null;draw();scrollTo(0,tab==="ai"?document.body.scrollHeight:0);return}
  if(t.dataset.l){lg=t.dataset.l;DAY="all";SHEET=null;t.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});load();return}
  const a=t.dataset.a,i=+t.dataset.i;
  if(a==="odds"){fetchOdds(i);return}
  if(a==="open"){SHEET=i;draw();return}
  if(a==="close"){SHEET=null;draw();return}
  if(a==="seen"){S.seen=1;save();draw();return}
  if(a==="sug"){ask(t.dataset.q);return}
  if(a==="send"){const q=$("#aiq");const v=q.value;q.value="";ask(v);return}
  if(a==="clearchat"){CHAT=[];saveChat();draw();return}
  if(a==="aislip"){ask("Analizá mi combinada: cuál es la selección más débil, si hay valor con las cuotas cargadas y qué riesgo tiene en total.");return}
  if(a==="aimatch"){const m=D.n[i];ask(`Analizá ${m.homeTeam.name} vs ${m.awayTeam.name}: qué dicen los números, qué mercados se ven más razonables según el modelo y qué riesgos hay.`);return}
  if(a==="slipodds"){fetchSlipOdds();return}
  if(a==="pick"){
    const m=D.n[i],k=t.dataset.k,on=S.slip.find(x=>x.id===m.id);
    if(on&&on.mk===k){S.slip=S.slip.filter(x=>x.id!==m.id);MK[m.id]=k;save();draw();toast("Quitada de la combinada");return}
    MK[m.id]=k;t.dataset.k=k;
    const h=m.homeTeam.name,aw=m.awayTeam.name,M=model(h,aw),it={id:m.id,mk:k,h,a:aw,u:m.utcDate,d:h+" vs "+aw,l:LBL(k,h,aw),p:M.P[k],odds:(OD[m.id]&&OD[m.id][k])||""},ex=S.slip.findIndex(s=>s.id===m.id);
    if(ex>=0)S.slip[ex]=it;else S.slip.push(it);
    save();draw();toast("Agregada: "+it.l);if(navigator.vibrate)navigator.vibrate(12);return;
  }
  if(a==="sel"){
    const m=D.n[i],k=MK[D.n[i].id]||"1",h=m.homeTeam.name,aw=m.awayTeam.name,M=model(h,aw),ex=S.slip.findIndex(s=>s.id===m.id);
    if(ex>=0&&S.slip[ex].mk===k)S.slip.splice(ex,1);
    else{const it={id:m.id,mk:k,h,a:aw,u:m.utcDate,d:h+" vs "+aw,l:LBL(k,h,aw),p:M.P[k],odds:(OD[m.id]&&OD[m.id][k])||""};if(ex>=0)S.slip[ex]=it;else S.slip.push(it)}
    save();draw();
  }else if(a==="rm"){S.slip.splice(i,1);save();draw()}
  else if(a==="reg"){
    const c=calc(),s=+$("#stk").value;
    if(!c.ok||!(s>0)){alert("Cargá las cuotas y el monto.");return}
    if(S.cap&&s>c.mx*1.001&&!confirm("Superás tu monto fijo ("+S.pct+"% del capital). ¿Seguro?"))return;
    S.bets.push({d:S.slip.map(x=>x.l).join(" + "),s:s,o:c.od,p:c.p,r:"?",t:Date.now(),n:S.slip.length});
    S.slip=[];S.stake="";save();tab="d";draw();scrollTo(0,0);
  }else if(a==="res"){S.bets[i].r=t.dataset.r;save();draw()}
  else if(a==="del"){S.bets.splice(i,1);save();draw()}
  else if(a==="cfg"){S.cap=+$("#cp").value||0;S.pct=Math.min(+$("#pp").value||1.5,100);S.ld=+$("#ld").value||0;S.lw=+$("#lw").value||0;save();draw()}
});
document.addEventListener("keydown",e=>{if(e.target.id==="aiq"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();const v=e.target.value;e.target.value="";ask(v)}});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.o!==undefined){S.slip[+t.dataset.o].odds=t.value;S.slip[+t.dataset.o].src="tu carga";save();draw()}
  else if(t.id==="stk"){S.stake=t.value;save()}
  else if(t.id==="lgsel"){lg=t.value;load()}
  else if(t.dataset.m!==undefined){MK[t.dataset.m]=t.value;draw()}
});
load();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
</script></body></html>
